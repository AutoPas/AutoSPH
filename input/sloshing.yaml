output:
  output_folder: "./output"
  session_name: "sloshing"

simulation:
  box_min: [0.0, 0.0, 0.0]
  box_max: [0.5, 0.5, 0.5]

  time_step: 0.0002
  total_time: 0.1
  write_frequency: 0.005

  cutoff: 0.03  # 0.012*2.5=0.03; where 2.5 = kernel support radius
  skin_cutoff_ratio: 0.15
  rebuild_frequency: 6  # has to be multiple of two, as there are two functor calls per iteration.
  num_samples: 6  # has to be multiple of 2, should also be multiple of rebuild_frequency (but this is not necessary)

forces:
  gravity: [0.0, -10.0, 0.0]
  time_dependent:
    - timestamp: 0.1
      force: [-5.0, 0.0, 0.0]
    - timestamp: 0.2
      force: [0.0, 0.0, 0.0]
    - timestamp: 0.3
      force: [5.0, 0.0, 0.0]
    - timestamp: 0.4
      force: [0.0, 0.0, 0.0]

particles:
  density: 1000.0

  particle_box_min: [0.2, 0.2, 0.2]
  particle_box_max: [0.3, 0.3, 0.3]
  particle_num: [12, 12, 12]

  smoothing_length: 0.012
  sound_speed: 20.0
