output:
  output_folder: "../output"
  session_name: "sloshing"

simulation:
  box_min: [0.0, 0.0, 0.0]
  box_max: [0.25, 0.25, 0.25]

  time_step: 0.0001
  total_time: 5
  write_frequency: 0.01

  skin_cutoff_ratio: 0.15
  rebuild_frequency: 6  # has to be multiple of two, as there are two functor calls per iteration.
  num_samples: 6  # has to be multiple of 2, should also be multiple of rebuild_frequency (but this is not necessary)

forces:
  gravity: [0.0, -10.0, 0.0]
  time_dependent:
    - timestamp: 1.0
      force: [-10.0, 0.0, 0.0]
    - timestamp: 2.0
      force: [0.0, 0.0, 0.0]
    - timestamp: 3.0
      force: [10.0, 0.0, 0.0]
    - timestamp: 4.0
      force: [0.0, 0.0, 0.0]

particles:
  density: 1000.0

  particle_box_min: [0.0, 0.0, 0.0]
  particle_box_max: [0.25, 0.125, 0.25]
  particle_num: [20, 10, 20]

  smoothing_length: 0.02
  boundary_spacing: 0.1 # multiplies smoothing_length, displaces boundary and ghost particles
  boundary_pressure: 2.0 # factor to multiply ghost particle pressure
  sound_speed: 20.0

  alpha: 1.0  # artificial viscosity coefficient
  beta: 2.0  # artificial viscosity coefficient

probes:
  - [0.002, 0.002, 0.125]
  - [0.125, 0.002, 0.125]
  - [0.248, 0.002, 0.125]
  - [0.0625, 0.0625, 0.125]
  - [0.125, 0.0625, 0.125]
  - [0.1875, 0.0625, 0.125]
  - [0.125, 0.125, 0.125]
