simulation:
  name: "Fluid Dynamics Test"

  BoxSize_X: 0.25
  BoxSize_Y: 0.25
  BoxSize_Z: 0.25

  time_step: 0.0002
  total_time: 0.5
  write_frequency: 0.005

  cutoff: 0.03  # 0.012*2.5=0.03; where 2.5 = kernel support radius
  skin_cutoff_ratio: 0.15
  rebuild_frequency: 6  # has to be multiple of two, as there are two functor calls per iteration.
  num_samples: 6  # has to be multiple of 2, should also be multiple of rebuild_frequency (but this is not necessary)

forces:
  gravity: [0.0, -10.0, 0.0]
  time_dependent:
    - timestamp: 0.1
      force: [-5.0, 0.0, 0.0]
    - timestamp: 0.2
      force: [0.0, 0.0, 0.0]
    - timestamp: 0.3
      force: [5.0, 0.0, 0.0]
    - timestamp: 0.4
      force: [0.0, 0.0, 0.0]

particles:
  count: 500
  gravity: [0.0, -9.81, 0.0]
