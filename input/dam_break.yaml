output:
  output_folder: "../output"
  session_name: "dam_break"

simulation:
  box_min: [0.0, 0.0, 0.0]
  box_max: [0.25, 0.25, 0.25]

  time_step: 0.0001
  total_time: 1
  write_frequency: 0.005

  cutoff: 0.03  # smoothing length * kernel support radius = 0.012 * 2.5 = 0.03
  skin_cutoff_ratio: 0.15
  rebuild_frequency: 6  # has to be multiple of two, as there are two functor calls per iteration.
  num_samples: 6  # has to be multiple of 2, should also be multiple of rebuild_frequency (but this is not necessary)

forces:
  gravity: [0.0, -10.0, 0.0]

particles:
  density: 1000.0

  particle_box_min: [0.0, 0.0, 0.0]
  particle_box_max: [0.0625, 0.125, 0.25]
  particle_num: [6, 12, 24]

  smoothing_length: 0.012
  sound_speed: 20.0

  alpha: 0.05  # artificial viscosity coefficient

LJ potential:  # Lennard Jones potential applied only by the boundary particles
  lj_cutoff: 0.00
  lj_epsilon: 0.5
  lj_sigma: 0.001
